<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food & Checkout</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="logo" href="index.html">Hall<span>Book</span></a><nav><a href="index.html">Home</a><a href="halls.html">Halls</a><a href="chairs.html">Chairs</a><a href="decor.html">Decoration</a><a class="active" href="food.html">Food</a></nav><button class="cart" onclick="document.getElementById('checkout').scrollIntoView()">🛒 Cart <b id="cartCount">0</b></button></header>
<main><section class="page-head"><p class="tag">CATERING</p><h1>Food Menu</h1><p>20+ vegetarian and 20+ non-vegetarian choices. Add or remove items with animation.</p></section>
<div class="food-tabs"><button class="tab active" onclick="showFood('veg',this)">🥗 Vegetarian</button><button class="tab" onclick="showFood('nonveg',this)">🍗 Non-Vegetarian</button></div>
<div id="foodGrid" class="product-grid"></div>
<section id="checkout" class="checkout"><div><h2>Your Cart</h2><div id="cartItems"><p class="empty">Your cart is empty.</p></div></div>
<div class="order-box"><h2>Booking & Payment</h2><label>Name<input id="customerName" placeholder="Your name"></label><label>Phone<input id="phone" placeholder="10 digit mobile"></label><label>Function date<input id="eventDate" type="date"></label><label>Payment method<select id="payment"><option value="UPI">UPI</option><option value="CARD">Card</option><option value="CASH">Cash on event day</option></select></label><div class="total">Total <strong id="total">₹0</strong></div><button class="btn full" onclick="placeOrder()">Confirm Booking</button><p id="orderMsg" class="message"></p></div></section></main>
<footer>HallBook • Demo payment flow (no real money is charged)</footer><script src="app.js"></script></body></html>
